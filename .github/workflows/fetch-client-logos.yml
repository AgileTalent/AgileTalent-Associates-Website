name: Download supplied client logos # retry supplied image CDN downloads
on:
  push:
    paths:
      - ".github/workflows/fetch-client-logos.yml"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependencies
        run: pip install requests pillow
      - name: Download supplied image URLs into local assets
        run: python scripts/fetch-client-logos.py
      - name: Commit local image files and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/
          if git diff --cached --quiet; then
            echo "No logo asset changes."
          else
            git commit -m "Download client logos into local assets"
            git push
          fi
