name: Validate V4 website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify website files
        run: |
          python3 <<'PY'
          from pathlib import Path
          root = Path(".")
          required = [
              "index.html", "about/index.html", "services/index.html",
              "recruitment/index.html", "industries/index.html",
              "careers/index.html", "insights/index.html", "contact/index.html",
              "career-studio/index.html", "hr-for-smes/index.html",
              "performance-management/index.html", "privacy/index.html",
              "recruitment-outsourcing/index.html", "salarysense/index.html",
              "style.css", "main.js", "career-studio.css", "career-studio.js",
              "salarysense.css", "salarysense.js", "sitemap.xml", "robots.txt", "CNAME"
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing required website files: " + ", ".join(missing))
          cname = (root / "CNAME").read_text(encoding="utf-8").strip().lower()
          if cname != "agiletalentassociates.com":
              raise SystemExit("Unexpected CNAME: " + cname)
          print(f"Validated {len(required)} required website files. No deployment performed.")
          PY
