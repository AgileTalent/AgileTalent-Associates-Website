name: Deploy AgileTalent V4 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare production artifact
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
      - name: Verify production artifact
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")
          required = [
              "index.html", "about/index.html", "services/index.html",
              "recruitment/index.html", "industries/index.html",
              "careers/index.html", "insights/index.html", "contact/index.html",
              "career-studio/index.html", "hr-for-smes/index.html",
              "performance-management/index.html", "privacy/index.html",
              "recruitment-outsourcing/index.html", "salarysense/index.html",
              "style.css", "main.js", "career-studio.css", "career-studio.js",
              "salarysense.css", "salarysense.js", "sitemap.xml", "robots.txt",
              "CNAME"
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing required production files: " + ", ".join(missing))

          cname = (root / "CNAME").read_text(encoding="utf-8").strip().lower()
          if cname != "agiletalentassociates.com":
              raise SystemExit("Unexpected CNAME: " + cname)

          # Check all root-relative HTML references resolve to a file, directory index,
          # or intentional in-page anchor. Ignore external links and query strings.
          problems = []
          for path in root.rglob("*.html"):
              source = path.read_text(encoding="utf-8")
              for match in re.finditer(r"""(?i)\\b(?:href|src|action|poster|data-src)\\s*=\\s*["'](/(?!/)[^"']*)["']""", source):
                  value = match.group(1).split("#", 1)[0].split("?", 1)[0]
                  if not value or value == "/":
                      continue
                  target = root / value.lstrip("/")
                  if target.is_dir():
                      target = target / "index.html"
                  if not target.is_file():
                      problems.append(f"{path}: {value}")
          if problems:
              raise SystemExit("Broken root-relative HTML references: " + "; ".join(problems[:40]))

          print(f"Verified {len(required)} required production files and root-relative references.")
          PY
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
