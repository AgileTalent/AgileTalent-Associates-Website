name: Deploy V4 staging site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare project-site paths
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          python3 <<'PY'
          from pathlib import Path
          import re

          base = "/agiletalent-website-v4"
          root = Path("_site")

          # Prefix root-relative HTML URL attributes for the GitHub project-site preview.
          attr = re.compile(r'(?i)(\b(?:href|src|action|poster|data-src)\s*=\s*)(["\'])/(?!/)([^"\']*)\2')
          refresh = re.compile(r'(?i)(url\s*=\s*)/(?!/)([^;\s"\']+)')
          for path in root.rglob("*.html"):
              source = path.read_text(encoding="utf-8")
              source = attr.sub(lambda m: m.group(1) + m.group(2) + base + "/" + m.group(3) + m.group(2), source)
              source = refresh.sub(lambda m: m.group(1) + base + "/" + m.group(2), source)
              source = source.replace("window.location.replace('/", "window.location.replace('" + base + "/")
              source = re.sub(r'(["\'])((?:about|career-studio|careers|contact|hr-for-smes|industries|insights|performance-management|privacy|recruitment-outsourcing|recruitment|salarysense|services)\.html)\1',
                              lambda m: m.group(1) + base + "/" + m.group(2)[:-5] + "/" + m.group(1), source)
              path.write_text(source, encoding="utf-8")

          # Prefix root-relative CSS assets without touching external URLs or data URIs.
          css_url = re.compile(r'url\(\s*(["\']?)/(?!/)([^)"\']+)')
          for path in root.rglob("*.css"):
              source = path.read_text(encoding="utf-8")
              source = css_url.sub(lambda m: "url(" + m.group(1) + base + "/" + m.group(2), source)
              path.write_text(source, encoding="utf-8")

          # Rewrite root-relative string paths and legacy .html links in JavaScript
          # used by generated content (e.g. the privacy-notice link).
          for path in root.rglob("*.js"):
              source = path.read_text(encoding="utf-8")
              source = re.sub(r'(["\'])/(?!/)([^"\']*)\1',
                              lambda m: m.group(1) + base + "/" + m.group(2) + m.group(1), source)
              source = re.sub(r'(["\'])((?:about|career-studio|careers|contact|hr-for-smes|industries|insights|performance-management|privacy|recruitment-outsourcing|recruitment|salarysense|services)\.html)\1',
                              lambda m: m.group(1) + base + "/" + m.group(2)[:-5] + "/" + m.group(1), source)
              path.write_text(source, encoding="utf-8")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
